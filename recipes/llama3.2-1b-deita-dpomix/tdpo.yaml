# Model arguments
model_name_or_path: data/llama3.2-1b-deita-dpomix/sft
torch_dtype: bfloat16

# Data arguments
dataset_mixer:
  HuggingFaceH4/ultrafeedback_binarized: 1.0
dataset_splits:
- train_prefs
preprocessing_num_workers: 12
overwrite_output_dir: false

# TDPO trainer arguments
bf16: true
do_eval: false
gradient_accumulation_steps: 16
gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: false
learning_rate: 5.0e-7
log_level: info
logging_steps: 1
lr_scheduler_type: cosine
max_length: 2048
max_prompt_length: 1800
num_train_epochs: 1
optim: adamw_torch
weight_decay: 0.1
output_dir: data/llama3.2-1b-deita-dpomix/tdpo
per_device_train_batch_size: 1
push_to_hub: false
report_to: wandb
run_name: tdpo_adamw
save_strategy: "steps"
save_steps: 100
save_only_model: true
seed: 42
warmup_ratio: 0.1
dataset_num_proc: 64
beta: 0.1
loss_type: tdpo2
tdpo_alpha: 0.5

# Loss weights
sft_on_chosen: 0
sft_on_rejected: 0
dpo_weight: 1
spft_weight: 0
distillation_weight: 0
chosen_distil_weight: 0
rejected_distil_weight: 0
adpa_weight: 0
