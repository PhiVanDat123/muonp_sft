# Model arguments
model_name_or_path: Qwen/Qwen2.5-7B
model_revision: main
torch_dtype: bfloat16
use_flash_attention_2: false

# Data arguments
dataset_mixer:
  hkust-nlp/deita-10k-v0: 1.0
dataset_splits:
- train
preprocessing_num_workers: 12
packing: true

# SFT trainer arguments
bf16: true
dataset_kwargs:
  add_special_tokens: false
  append_concat_token: false
do_eval: false
eval_strategy: epoch
gradient_accumulation_steps: 4
gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: false
learning_rate: 2.0e-05
log_level: info
logging_steps: 5
logging_strategy: steps
lr_scheduler_type: cosine
max_seq_length: 2048
max_steps: -1
num_train_epochs: 3
optim: adamw_torch
weight_decay: 0.1
output_dir: data/llama3.2-1b-deita-dpomix/sft
per_device_eval_batch_size: 4
per_device_train_batch_size: 4
push_to_hub: false
remove_unused_columns: true
report_to: wandb
run_name: sft_adamw
save_strategy: "no"
seed: 42
warmup_steps: 117
